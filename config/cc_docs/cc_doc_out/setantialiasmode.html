		<p><b>sub SetAntiAliasMode( aa_mode ) </b></p>
		<p>
		 Sets the anti-alias mode for draw image commands 
		</p>
		<p>
		 Possible modes 
		</p>
		<ul>
		<li>
		AA_MODE_OFF 
		</li>
		<li>
		AA_MODE_SIMPLE 
		</li>
		<li>
		AA_MODE_QUALITY 
		</li>
		<li>
		AA_MODE_LINE_SMOOTH 
		</li>
		<li>
		AA_MODE_POINT_SMOOTH 
		</li>
		<li>
		AA_MODE_FULL_BASIC 
		</li>
		<li>
		AA_MODE_ALPHA_TO_COVERAGE 
		</li>
		</ul>
		<br><p>Related: 
		<u><font color="blue">GetAntiAliasMode</font></u>
		</p>

		<p><b>function  getJointMaxTorque( joint_id) </b></p>
		<p>
		 Returns the upper limit on the amount of torque (rotational force) the joint can apply, controlling how much rotational resistance or power the joint provides. 
		</p>
		<p>
		 Used with 
		</p>

		<li>
		Friction Joint 
		</li>

		</li>

	<body>
		<p><b>Function GetSpriteType(sprite) </b></p>
		<p>
		 Returns the collison body type of a sprite. 
		</p>
		<p>
		 By default, sprites are dynamic when they are created. 
		</p>
		<p>
		 Possible types returned 
		</p>
		<ul>
		<li>
		SPRITE_TYPE_STATIC 
		</li>
		<li>
		SPRITE_TYPE_KINEMATIC 
		</li>
		<li>
		SPRITE_TYPE_DYNAMIC 
		</li>
		</ul>
		<br><p>Related: 
		<u><font color="blue">SetSpriteType</font></u>
		</p>
		<p>

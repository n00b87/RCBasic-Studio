		<p><h2>Sub GetSpriteShapeOffset( spr_id, ByRef x, ByRef y ) </h2></p>
		<p>
		 Gets the offset from the default local position of a sprites collision shape 
		</p>
		<p>
		 NOTE: For Circles, this is the offset from the center of the sprite and for boxes its the upper left corner 
		</p>
